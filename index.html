<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO RUN</title>
<style>
html,body{margin:0;height:100%;background:#05030d;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,S=1,VW=1600;
const LH=450,TAU=Math.PI*2,PI=Math.PI,G=2700,JV=960,JV2=860,GY1=352,GY2=366,PX=300,TU=JV/G;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function RR(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function fs(g,f,s,lw){if(f){g.fillStyle=f;g.fill();}if(s){g.strokeStyle=s;g.lineWidth=lw||2;g.stroke();}}
function limb(g,x0,y0,x1,y1,x2,y2,w,col,ol,ow){g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=ol;g.lineWidth=w+(ow||3.5);g.stroke();g.strokeStyle=col;g.lineWidth=w;g.stroke();}
function legPts(hx,hy,A,B,l1,l2){const kx=hx+Math.sin(A)*l1,ky=hy+Math.cos(A)*l1,a2=A-B;return[kx,ky,kx+Math.sin(a2)*l2,ky+Math.cos(a2)*l2,a2];}
function star4(g,x,y,r,rot){g.beginPath();for(let i=0;i<8;i++){const a=rot+i*PI/4,rr=i%2?r*.26:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();}

/* ---------- glow sprites ---------- */
function mkGlow(rgb){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba('+rgb+',1)');gr.addColorStop(.35,'rgba('+rgb+',.38)');gr.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
const GL={white:mkGlow('255,255,255'),green:mkGlow('130,255,70'),cyan:mkGlow('70,240,255'),warm:mkGlow('255,215,140'),red:mkGlow('255,60,90')};
function glow(g,spr,x,y,r,a){g.save();g.globalCompositeOperation='lighter';g.globalAlpha=a;g.drawImage(spr,x-r,y-r,r*2,r*2);g.restore();}

/* ---------- audio ---------- */
let AC=null,master=null,muted=true,nextNote=0,step=0,nbuf=null;
const mf=m=>440*Math.pow(2,(m-69)/12);
function audioClick(){if(AC){muted=!muted;master.gain.value=muted?0:.5;return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);muted=false;nextNote=AC.currentTime+.06;}
function tone(f,t,d,type,vol,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);}
function noise(t,d,vol,hp){if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03);}
let silent=true;
function sfx(n,k){if(!AC||muted||silent)return;const t=AC.currentTime;
  if(n==='jump')tone(300,t,.13,'square',.07,640);
  else if(n==='jump2')tone(520,t,.15,'square',.07,1150);
  else if(n==='land')tone(130,t,.08,'triangle',.12,60);
  else if(n==='slide')noise(t,.25,.07,1800);
  else if(n==='near'){tone(1100,t,.32,'sawtooth',.06,180);noise(t,.3,.06,900);}
  else if(n==='ram'){const f=mf(76+Math.min(k||0,12));tone(f,t,.08,'square',.06);tone(f*1.5,t+.055,.1,'square',.05);}
  else if(n==='drain')tone(320,t,.35,'sawtooth',.05,70);}
const CH=[[45,0],[41,1],[48,1],[43,1]];
function music(){if(!AC||muted)return;if(nextNote<AC.currentTime-.3)nextNote=AC.currentTime+.05;
  while(nextNote<AC.currentTime+.14){const st=step%16,ch=CH[(step>>4)%4],root=ch[0],th=ch[1]?4:3,t=nextNote;
    if(st%4===0)tone(150,t,.13,'sine',.28,42);
    if(st%2===0)tone(mf(root+(st%4===2?12:0)),t,.11,'square',.05);
    const arp=[0,7,12,th+12,7,12,th+12,19][st%8];tone(mf(root+24+arp),t,.09,'square',.026);
    if(st%2===1)noise(t,.03,.03,7000);if(st%8===4)noise(t,.1,.06,2400);
    nextNote+=60/152/4;step++;}}

/* ---------- state ---------- */
function mkRunner(){return{x:0,alt:0,vy:0,on:true,jumps:0,slide:false,wasSlide:false,slideHeld:false,phase:0,sq:0,sqv:0,hair:0,hv:0,auto:true,idle:0,wantDbl:false,inv:0,happy:0,panic:0};}
function mkLane(gy,dc,ac){return{t:0,v:430,cam:-PX,camY:0,ts:1,slow:0,flash:0,shake:0,zoom:1,parts:[],pops:[],lines:[],r:mkRunner(),gy,dc,ac,nm:0};}
const T=mkLane(GY1,'#9a90e8','#b4ff6e'),B=mkLane(GY2,'#f6e2bd','#8ff');
Object.assign(T,{en:[],bld:[{x0:-3000,x1:Infinity}],pend:null,lastEnd:0,n:0,lastTy:'',over:true});
Object.assign(B,{laps:[],nextX:520,ram:0,show:0,count:0,stage:0,mflash:0,punch:0,combo:0,ln:0,groundT:0});
for(const L of [T,B])for(let i=0;i<16;i++)L.lines.push({x:Math.random(),y:Math.random(),l:rnd(60,200),s:rnd(1.4,2.6)});
const stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random(),s:rnd(.8,2.2),f:rnd(.6,2.4),p:rnd(0,6)});
const motes=[];for(let i=0;i<34;i++)motes.push({x:Math.random(),y:Math.random(),s:rnd(.3,1),p:rnd(0,6),r:rnd(1,2.6)});
const STG=['8GB','4GB','2GB','1GB','512MB','256MB','128MB','64MB','32MB','16MB','8MB','4MB','2MB','1MB','640KB'];

/* ---------- particles ---------- */
function part(L,x,y,vx,vy,life,size,col,kind,grav,add){if(L.parts.length>420)return;L.parts.push({x,y,vx,vy,life,max:life,size,col,kind,grav:grav||0,add:!!add,rot:Math.random()*TAU});}
function burst(L,x,y,n,col,spd,kind,life,size,grav,add){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(.3+Math.random()*.7);part(L,x,y,Math.cos(a)*s,Math.sin(a)*s,life*(.5+Math.random()*.5),size*(.6+Math.random()*.6),col,kind,grav,add);}}
function dust(L,x,y,n){for(let i=0;i<n;i++)part(L,x+rnd(-12,12),y-rnd(0,4),rnd(-110,70),rnd(-55,-5),rnd(.3,.6),rnd(5,10),L.dc,4);}
function pop(L,x,y,txt,col,size){L.pops.push({x,y,txt,col,size,life:.85,max:.85});}
function updFx(L,dt,real){
  for(let i=L.parts.length-1;i>=0;i--){const p=L.parts[i];p.life-=dt;if(p.life<=0){L.parts.splice(i,1);continue;}p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=L.pops.length-1;i>=0;i--){const p=L.pops[i];p.life-=real;if(p.life<=0){L.pops.splice(i,1);continue;}p.y-=real*60*(p.life/p.max);}
  for(const l of L.lines){l.x-=L.v*l.s*dt/1600;if(l.x<-.2){l.x=1.1;l.y=Math.random();}}
  L.flash=Math.max(0,L.flash-real*3.2);L.shake*=Math.exp(-real*9);L.zoom+=(1-L.zoom)*Math.min(1,real*5);L.nm-=real;
}
function drawParts(g,L){
  for(const p of L.parts){const a=p.life/p.max,sx=p.x-L.cam;if(sx<-80||sx>VW+80)continue;
    g.globalCompositeOperation=p.add?'lighter':'source-over';g.globalAlpha=a;
    if(p.kind===0){g.fillStyle=p.col;g.beginPath();g.arc(sx,p.y,p.size*(.4+.6*a),0,TAU);g.fill();}
    else if(p.kind===1){g.strokeStyle=p.col;g.lineWidth=p.size;g.lineCap='round';g.beginPath();g.moveTo(sx,p.y);g.lineTo(sx-p.vx*.045,p.y-p.vy*.045);g.stroke();}
    else if(p.kind===2){g.fillStyle=p.col;star4(g,sx,p.y,p.size*(.4+a*.8),p.rot+(1-a)*2);g.fill();}
    else if(p.kind===3){g.globalAlpha=a*.85;g.strokeStyle=p.col;g.lineWidth=3*a+.6;g.beginPath();g.arc(sx,p.y,p.size*(1-a)+5,0,TAU);g.stroke();}
    else if(p.kind===4){g.globalAlpha=a*.5;g.fillStyle=p.col;g.beginPath();g.arc(sx,p.y,p.size*(1.7-a*.8),0,TAU);g.fill();}
    else{g.globalAlpha=1;glow(g,GL.white,sx,p.y,p.size*2.6,a);g.globalCompositeOperation='lighter';g.globalAlpha=a;g.fillStyle='#fff';star4(g,sx,p.y,p.size*(1.3-a*.3),PI/8);g.fill();}
  }
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}
function drawPops(g,L){g.textAlign='center';
  for(const p of L.pops){const a=p.life/p.max,age=p.max-p.life,sc=1+Math.max(0,1-age*9)*.9;g.save();g.translate(p.x-L.cam,p.y);g.scale(sc,sc);g.rotate(-.08);g.globalAlpha=Math.min(1,a*2.6);
    g.font='900 italic '+p.size+'px "Arial Black",Impact,"Helvetica Neue",sans-serif';g.lineJoin='round';g.lineWidth=p.size*.24;g.strokeStyle='rgba(12,8,34,.92)';g.strokeText(p.txt,0,0);
    g.shadowColor=p.col;g.shadowBlur=16;g.fillStyle=p.col;g.fillText(p.txt,0,0);g.restore();}
  g.textAlign='left';}

/* ---------- runner physics ---------- */
function jump(r,L){if(!(r.on||r.jumps<2))return;const first=r.jumps===0;r.vy=first?JV:JV2;r.jumps++;const y=L.gy-r.alt;
  if(first){if(r.on)dust(L,r.x,L.gy,5);sfx('jump');}
  else{part(L,r.x,y-30,0,0,.35,46,L.ac,3,0,true);burst(L,r.x,y-20,10,L.ac,260,1,.35,2.4,300,true);burst(L,r.x,y-20,5,'#fff',160,2,.4,7,0,true);sfx('jump2');}
  r.on=false;r.slide=false;r.sqv=6.2;}
function stepRunner(r,dt,v,over,L){const gy=L.gy;
  r.x+=v*dt;
  if(r.on&&!over){r.on=false;r.vy=0;}
  if(r.on){r.phase+=dt*v*.043;r.slide=r.slideHeld;
    if(r.slide){if(!r.wasSlide){sfx('slide');r.sqv=-3;}
      if(Math.random()<dt*45)part(L,r.x-14,gy-2,rnd(-150,-40),rnd(-60,-10),rnd(.25,.45),rnd(4,8),L.dc,4);
      if(Math.random()<dt*34)part(L,r.x+22,gy-3,rnd(-280,-120),rnd(-150,-30),.25,2.2,L.ac,1,500,true);}
    else if(Math.random()<dt*10)part(L,r.x-12,gy-2,rnd(-70,-20),rnd(-34,-8),.3,rnd(3,5.5),L.dc,4);
  }else{r.slide=false;
    r.vy-=G*dt*((r.slideHeld&&r.vy<250)?2.4:1);r.alt+=r.vy*dt;
    if(Math.random()<dt*26)part(L,r.x-10,gy-r.alt-rnd(20,70),rnd(-90,-20),rnd(-20,20),.3,rnd(1.6,3.4),L.ac,0,0,true);
    if(over&&r.vy<=0&&r.alt<=0&&r.alt>-28){r.alt=0;r.vy=0;r.on=true;r.jumps=0;r.sqv=-7.5;dust(L,r.x,gy,8);sfx('land');}
    else if(r.alt<-80){r.vy=1180;r.jumps=1;burst(L,r.x,gy+40,10,L.ac,240,1,.4,2.5,200,true);if(!r.auto)r.inv=1;}
  }
  r.wasSlide=r.slide;
  r.sqv+=(-r.sq*260-r.sqv*17)*dt;r.sq+=r.sqv*dt;
  const ht=r.on?Math.sin(r.phase*2)*1.3:clamp(-r.vy*.006,-4,5);
  r.hv+=((ht-r.hair)*190-r.hv*13)*dt;r.hair+=r.hv*dt;
  if(r.inv>0)r.inv-=dt;if(r.happy>0)r.happy-=dt;
  if(!r.auto){r.idle+=dt;if(r.idle>7){r.auto=true;r.slideHeld=false;}}
  L.cam=r.x-PX;L.camY+=(Math.max(0,r.alt)*.2-L.camY)*Math.min(1,dt*6);
}

/* ---------- top lane logic ---------- */
const DEF={strut:{spd:70,lead:.36,tail:.42,ai:.35},slide:{spd:260,lead:.25,tail:.5,ai:.22},heli:{spd:40,lead:.36,tail:.24,ai:.3},trio:{spd:70,lead:.65,tail:.62,ai:.61},gap:{spd:0,lead:.14,tail:.7,ai:0}};
const SEQ=['strut','heli','gap','trio','slide','strut','gap','heli','strut','trio','slide','heli'];
function boxes(e){if(e.type==='trio')return[[e.x-105,14,0,128],[e.x,14,0,128],[e.x+105,14,0,128]];if(e.type==='strut')return[[e.x,14,0,128]];if(e.type==='slide')return[[e.x-8,30,0,62]];return[[e.x,14,e.alt,e.alt+130]];}
function aiTop(){const L=T,r=L.r,v=L.v;let hold=false;
  for(const e of L.en){if(e.done)continue;const tc=(e.x-r.x)/(v+e.spd);
    if(e.type==='heli'){if(tc<DEF.heli.ai&&e.x>r.x-64)hold=true;}
    else if(r.on&&!e.jumped&&tc>0&&tc<=DEF[e.type].ai){e.jumped=true;jump(r,L);r.wantDbl=e.type==='trio';}}
  if(r.on)for(const b of L.bld){if(r.x<=b.x1&&b.x1-r.x<26+v*.012){jump(r,L);r.wantDbl=false;break;}}
  if(!r.on&&r.wantDbl&&r.jumps===1&&r.vy<=30){r.wantDbl=false;jump(r,L);}
  if(!r.on&&r.alt<-8&&r.jumps<2&&r.vy<0)jump(r,L);
  r.slideHeld=hold;}
function nearMiss(L,r){L.slow=.3;L.flash=1;L.shake=10;L.zoom=1.09;L.nm=1.7;const y=L.gy-r.alt;
  pop(L,r.x+36,y-124,'!','#fff36b',50);burst(L,r.x+10,y-50,14,'#b4ff6e',420,1,.4,2.6,0,true);burst(L,r.x+10,y-50,6,'#fff',220,2,.45,9,0,true);sfx('near');}
function updTop(dt,real){const L=T,r=L.r;L.t+=dt;L.v=Math.min(430+L.t*5,700);const v=L.v;
  L.over=L.bld.some(b=>r.x>=b.x0-8&&r.x<=b.x1+8);
  if(r.auto)aiTop();
  stepRunner(r,dt,v,L.over,L);
  // spawner
  if(!L.pend){let ty;if(L.n<SEQ.length)ty=SEQ[L.n];else{const q=Math.random();ty=q<.3?'strut':q<.5?'slide':q<.7?'heli':q<.85?'trio':'gap';}
    if(ty==='gap'&&L.lastTy==='gap')ty='strut';L.pend={ty,rest:rnd(.22,.7)};}
  {const d=DEF[L.pend.ty],sx=L.cam+VW+170,tA=L.t+(sx-r.x)/(v+d.spd);
    if(tA-d.lead>=L.lastEnd+L.pend.rest){const ty=L.pend.ty;
      if(ty==='gap'){const last=L.bld[L.bld.length-1];last.x1=sx;L.bld.push({x0:sx+110+v*.06,x1:Infinity});}
      else L.en.push({type:ty,x:sx+(ty==='trio'?105:0),spd:d.spd,ph:rnd(0,6),alt:140,drop:1,done:false,jumped:false,hit:false});
      L.lastEnd=tA+d.tail;L.lastTy=ty;L.n++;L.pend=null;}}
  // enemies
  let threat=false;const ph=r.slide?56:86;
  for(let i=L.en.length-1;i>=0;i--){const e=L.en[i];e.x-=e.spd*dt;if(e.type!=='slide'&&e.type!=='heli')e.ph+=dt*6.4;const sx=e.x-L.cam;
    if(e.type==='heli'){const d=clamp((sx-620)/650,0,1);e.drop=d;e.alt=74+d*66;}
    if(sx<-340){L.en.splice(i,1);continue;}
    if(sx<VW+60){
      if((e.type==='strut'||e.type==='trio')&&Math.random()<dt*(e.type==='trio'?10:5))part(L,e.x+rnd(-140,140),GY1-rnd(30,190),0,0,.15,rnd(14,30),'#fff',5,0,true);
      if(e.type==='slide'&&Math.random()<dt*40)part(L,e.x-38,GY1-3,rnd(60,260),rnd(-160,-20),.28,2.2,'#ffd27a',1,500,true);
      if(e.type==='slide'&&Math.random()<dt*20)part(L,e.x-20,GY1-2,rnd(20,90),rnd(-40,-8),.4,rnd(4,8),L.dc,4);}
    if(!e.done&&e.x-r.x>0&&e.x-r.x<430)threat=true;
    if(!e.done){
      for(const b of boxes(e)){if(Math.abs(b[0]-r.x)<b[1]+15&&r.alt<b[3]&&r.alt+ph>b[2]){if(!r.auto&&r.inv<=0){e.hit=true;r.inv=1.1;L.shake=13;L.flash=.7;burst(L,r.x,GY1-r.alt-40,12,'#ff6a80',300,1,.4,2.6,400,true);}}}
      const tail=e.type==='trio'?105:0;
      if(e.x+tail<r.x-20){e.done=true;
        if(!e.hit&&L.nm<=0){const gap=e.type==='heli'?e.alt-(r.alt+ph):r.alt-(e.type==='slide'?62:128);if(gap>-20&&gap<62)nearMiss(L,r);}}}
  }
  r.panic+=(((threat||!r.on||r.slide)?1:0)-r.panic)*Math.min(1,dt*14);
  while(L.bld.length&&L.bld[0].x1<L.cam-300)L.bld.shift();
  updFx(L,dt,real);
}

/* ---------- bottom lane logic ---------- */
const LCOL=[['#6aa0ff','#9b5bff'],['#ff7cc0','#ff9a5b'],['#42e6a4','#2bb3ff'],['#ffc857','#ff5e7e'],['#8a7bff','#31d0ff']];
function traj(t,dbl){if(!dbl||t<=TU)return JV*t-G*t*t/2;const u=t-TU;return JV*JV/(2*G)+JV2*u-G*u*u/2;}
function mkLaptop(x){const L=B,v=L.v+8,KS=['arc','dbl','row','arc','dbl','arc'];
  let kind=L.ln<KS.length?KS[L.ln]:(()=>{const q=Math.random();return q<.45?'arc':q<.8?'dbl':'row';})();
  if(kind==='row'&&L.lastKind==='row')kind='arc';
  const lp={x,w:250,col:LCOL[L.ln%LCOL.length],kind,st:[],got:0,drain:0,dv:0,go:false,jumped:false,to:0,s0:0,s1:0};let end;
  if(kind==='row'){for(let i=0;i<4;i++)lp.st.push({tx:x+34+i*62,ta:30});lp.s0=x-14;lp.s1=x+34+3*62+26;end=lp.s1;}
  else{const dbl=kind==='dbl',to=x-(dbl?150:40);lp.to=to;const ts=dbl?[.16,.31,.5,.68,.85,1.0]:[.15,.29,.43,.57];
    for(const t of ts)lp.st.push({tx:to+v*t,ta:traj(t,dbl)+44});end=to+v*(dbl?1.16:.72);}
  lp.st.forEach((s,i)=>{s.f=0;s.d=i*.07;s.got=false;s.rot=rnd(-.3,.3);});
  L.laps.push(lp);L.ln++;L.lastKind=kind;
  L.nextX=Math.max(x+lp.w+110,end+v*.32+170)+rnd(0,160);}
function stickPos(lp,s,now){const e=1-Math.pow(1-s.f,3);return[lerp(lp.x+lp.w/2,s.tx,e),lerp(16,s.ta,e)+Math.sin(s.f*PI)*46+(s.f>=1?Math.sin(now*4+s.tx*.05)*3:0)];}
function aiBot(){const L=B,r=L.r;let hold=false;
  for(const lp of L.laps){if(lp.kind==='row'){if(r.x>=lp.s0&&r.x<=lp.s1)hold=true;}
    else if(!lp.jumped&&r.x>=lp.to){if(r.on){lp.jumped=true;jump(r,L);r.wantDbl=lp.kind==='dbl';}else if(r.x>lp.to+90)lp.jumped=true;}}

/* ---------- tiles ---------- */
let tiles=null;
function mkTile(wv,fn){const sc=Math.min(DPR*S,2),c=document.createElement('canvas');c.width=Math.ceil(wv*sc);c.height=Math.ceil(LH*sc);const g=c.getContext('2d');g.scale(c.width/wv,c.height/LH);fn(g,wv,LH);return{c,w:wv};}
function drawTile(g,t,off,ys){let x=-(((off%t.w)+t.w)%t.w);for(;x<VW;x+=t.w)g.drawImage(t.c,x,ys,t.w+.6,LH);}
function buildTiles(){tiles={
  t0:mkTile(1800,city({seed:11,base:345,h0:90,h1:250,w0:36,w1:80,c1:'#3d2c80',c2:'#2a1c5e',edge:'rgba(170,150,255,.28)',ws:3,wg:4,lit:.22,cols:['#ffd98a','#9fd0ff','#c9a5ff'],neon:.06,beacon:.3,sc:1})),

/* ---------- lane rendering ---------- */
function label(g,txt,col){g.font='800 12.5px "Avenir Next","Helvetica Neue",Arial,sans-serif';g.letterSpacing='2.5px';const w=g.measureText(txt).width;
  RR(g,16,14,w+36,25,12.5);fs(g,'rgba(8,6,22,.6)');g.save();g.shadowColor=col;g.shadowBlur=10;g.fillStyle=col;g.beginPath();g.arc(31,26.5,3.6,0,TAU);g.fill();g.restore();
  g.fillStyle='#fff';g.textAlign='left';g.fillText(txt,42,31);g.letterSpacing='0px';}
function overlays(g,L,col,lineCol){
  g.save();g.globalCompositeOperation='lighter';g.strokeStyle=lineCol;g.lineWidth=1.6;g.lineCap='round';const k=clamp((L.v-380)/320,0,1)*.7+.3+(L.slow>0?.6:0);

  if(L.flash>0){g.save();g.globalCompositeOperation='lighter';g.globalAlpha=L.flash*.4;g.fillStyle=col;g.fillRect(0,0,VW,LH);g.restore();}}
function worldXf(g,L,gy){g.translate(PX,gy-60);g.scale(L.zoom,L.zoom);g.translate(-PX+(Math.random()-.5)*L.shake,-(gy-60)+(Math.random()-.5)*L.shake+L.camY);}
function drawTop(g,now){const L=T,r=L.r,cam=L.cam;
  let gr=g.createLinearGradient(0,0,0,LH);gr.addColorStop(0,'#060316');gr.addColorStop(.4,'#170b45');gr.addColorStop(.72,'#44176f');gr.addColorStop(1,'#8a2480');g.fillStyle=gr;g.fillRect(0,0,VW,LH);
  g.fillStyle='#fff';for(const s of stars){g.globalAlpha=.3+.7*Math.abs(Math.sin(now*s.f+s.p));g.fillRect(s.x*VW,s.y*240,s.s,s.s);}g.globalAlpha=1;
  const mx=VW*.8,my=88+L.camY*.05;glow(g,GL.white,mx,my,150,.5);glow(g,GL.green,mx,my,240,.22);
  g.fillStyle='#fff8dc';g.beginPath();g.arc(mx,my,44,0,TAU);g.fill();
  g.fillStyle='rgba(214,200,160,.55)';for(const c of[[-14,-10,9],[12,8,12],[-8,18,6],[18,-18,5]]){g.beginPath();g.arc(mx+c[0],my+c[1],c[2],0,TAU);g.fill();}

  g.restore();

  g.fillStyle='#ffe2ac';g.fillRect(a,386,w,3);gr=g.createLinearGradient(0,389,0,LH+40);gr.addColorStop(0,'#a8632f');gr.addColorStop(1,'#5a2d16');g.fillStyle=gr;g.fillRect(a,389,w,LH+200-389);
  for(let k=Math.floor((cam-140)/520),k1=Math.floor((cam+VW+140)/520);k<=k1;k++){const wx=k*520-cam;g.fillStyle='rgba(60,25,10,.5)';g.fillRect(wx,389,3,260);RR(g,wx+220,412,80,8,4);fs(g,'#edc892');}

  const px=r.x-cam,py=GY2-r.alt;{const k=clamp(1-r.alt/380,.3,1);g.fillStyle='rgba(80,35,15,'+(.4*k)+')';g.beginPath();g.ellipse(px,GY2+3,26*k,5*k,0,0,TAU);g.fill();}

  const fr=Math.max(.02,Math.pow(2,-L.count/9));RR(g,X-238,99,226,7,3.5);fs(g,'rgba(255,255,255,.22)');RR(g,X-238,99,226*fr,7,3.5);fs(g,fr>.5?'#7dff9a':fr>.2?'#ffc857':'#ff5a4a');

function render(now){
  for(let i=0;i<2;i++){ctx.save();ctx.setTransform(DPR*S,0,0,DPR*S,0,i*cv.height/2);ctx.beginPath();ctx.rect(0,0,VW,LH);ctx.clip();if(i)drawBottom(ctx,now);else drawTop(ctx,now);ctx.restore();}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#05030d';ctx.fillRect(0,H/2-2.5,W,5);
  const dg=ctx.createLinearGradient(0,0,W,0);dg.addColorStop(0,'#8dff4a');dg.addColorStop(1,'#5ff');ctx.save();ctx.shadowColor='#9ff';ctx.shadowBlur=10;ctx.fillStyle=dg;ctx.fillRect(0,H/2-.75,W,1.5);ctx.restore();
}

/* ---------- input ---------- */
function man(r){if(r.auto){r.auto=false;r.slideHeld=false;r.wantDbl=false;}r.idle=0;}
addEventListener('keydown',e=>{const c=e.code;
  if(c==='KeyW'){man(T.r);if(!e.repeat)jump(T.r,T);}
  else if(c==='KeyS'){man(T.r);T.r.slideHeld=true;}
  else if(c==='ArrowUp'){man(B.r);if(!e.repeat)jump(B.r,B);e.preventDefault();}
  else if(c==='ArrowDown'){man(B.r);B.r.slideHeld=true;e.preventDefault();}});
addEventListener('keyup',e=>{if(e.code==='KeyS'&&!T.r.auto)T.r.slideHeld=false;if(e.code==='ArrowDown'&&!B.r.auto)B.r.slideHeld=false;});
addEventListener('pointerdown',audioClick);

/* ---------- boot ---------- */
let rsT=0;
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);S=(H/2)/LH;VW=W/S;}
addEventListener('resize',()=>{resize();clearTimeout(rsT);rsT=setTimeout(buildTiles,160);});
resize();buildTiles();
for(let i=0;i<190;i++){updTop(1/60,1/60);updBot(1/60,1/60,i/60);}
for(const L of [T,B]){L.slow=0;L.flash=0;L.shake=0;L.zoom=1;L.ts=1;L.pops.length=0;}
silent=false;
let last=performance.now();
function tick(ms){const real=Math.min((ms-last)/1000,.034);last=ms;const now=ms/1000;
  for(const L of [T,B]){L.slow-=real;const tg=L.slow>0?.22:1;L.ts+=(tg-L.ts)*Math.min(1,real*22);}
  updTop(real*T.ts,real);updBot(real*B.ts,real,now);
  render(now);music();requestAnimationFrame(tick);}
requestAnimationFrame(tick);
</script>
