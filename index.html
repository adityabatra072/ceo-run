<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CEO RUN</title>
<style>
html,body{margin:0;height:100%;background:#05030d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas#c{display:block;position:fixed;left:0;top:0;width:100vw;height:100vh;cursor:pointer;touch-action:none}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#fff;z-index:5;overflow:auto}
.ov.show{display:flex}
#menu{background:radial-gradient(ellipse 72% 62% at 50% 50%,rgba(5,3,13,.8),rgba(5,3,13,.52) 70%,rgba(5,3,13,.3))}
.kick{font-weight:800;font-size:12px;letter-spacing:4px;color:rgba(255,255,255,.78);text-transform:uppercase}
.title{font:italic 900 clamp(62px,15vw,150px)/.95 "Arial Black",Impact,"Helvetica Neue",sans-serif;letter-spacing:-.02em;padding:0 .1em;background:linear-gradient(90deg,#8dff4a,#5ff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(120,255,200,.45)) drop-shadow(0 5px 0 rgba(8,6,22,.95));transform:rotate(-4deg);margin:2px 0 10px;white-space:nowrap}
.btns{display:flex;gap:18px;justify-content:center;margin-top:20px;width:100%;flex-wrap:wrap}
.pick{--c:#8dff4a;--g:rgba(141,255,74,.32);display:flex;align-items:center;gap:14px;width:min(390px,100%);padding:12px 18px 12px 12px;border-radius:22px;border:2px solid var(--c);background:linear-gradient(180deg,rgba(22,14,52,.92),rgba(8,6,22,.92));box-shadow:0 0 24px var(--g),inset 0 0 20px var(--g);color:#fff;cursor:pointer;text-align:left;font:inherit;touch-action:manipulation;transition:transform .12s,box-shadow .12s;box-sizing:border-box}
.pick.s{--c:#5ff;--g:rgba(85,255,255,.3)}
.pick:hover,.pick:focus-visible{transform:translateY(-3px) scale(1.02);box-shadow:0 0 40px var(--c),inset 0 0 24px var(--g);outline:none}
.pick:active{transform:scale(.98)}
.pv{width:84px;height:84px;border-radius:16px;flex:none;border:1.5px solid rgba(255,255,255,.25)}
.pick b{display:block;font:italic 900 25px/1.02 "Arial Black",Impact,"Helvetica Neue",sans-serif;letter-spacing:.01em}
.pick i{display:block;font-style:normal;font-weight:800;font-size:12px;letter-spacing:2.2px;color:var(--c);margin-top:7px;text-transform:uppercase}
.pick em{display:block;font-style:normal;font-weight:700;font-size:12px;letter-spacing:1.6px;color:rgba(255,255,255,.65);margin-top:5px}
.keys{margin-top:20px;font-weight:700;font-size:12px;letter-spacing:1.4px;color:rgba(255,255,255,.72);text-align:center;max-width:640px;line-height:1.9}
.keys kbd{font:inherit;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:6px;padding:1px 6px}
.mini{font:800 12px "Avenir Next","Helvetica Neue",Arial,sans-serif;letter-spacing:2px;color:#fff;background:rgba(8,6,22,.65);border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 15px;cursor:pointer;touch-action:manipulation}
#snd{margin-top:14px}
#mbtn{position:fixed;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));z-index:4;display:none}
#over{background:rgba(5,3,13,.5)}
.ocard{--c:#8dff4a;--g:rgba(141,255,74,.3);width:min(380px,100%);box-sizing:border-box;padding:26px 22px 20px;border-radius:26px;background:linear-gradient(180deg,rgba(22,14,52,.94),rgba(8,6,22,.94));border:2px solid var(--c);box-shadow:0 0 44px var(--g),inset 0 0 26px var(--g);text-align:center}
#over.s .ocard{--c:#5ff;--g:rgba(85,255,255,.3)}
.gov{font-weight:800;font-size:12px;letter-spacing:4px;color:rgba(255,255,255,.6)}
.why{margin-top:8px;font:italic 900 clamp(21px,6vw,29px)/1.1 "Arial Black",Impact,sans-serif;color:#ff6a80;text-shadow:0 0 18px rgba(255,60,90,.55),0 3px 0 rgba(8,6,22,.9);transform:rotate(-2deg)}
.lbl{margin-top:18px;font-weight:800;font-size:12px;letter-spacing:3px;color:var(--c)}
.big{font:italic 900 clamp(44px,13vw,62px)/1.05 "Arial Black",Impact,sans-serif;color:#f2fff6;text-shadow:0 0 20px var(--c),0 4px 0 rgba(8,6,22,.9)}
.nb{display:none;margin-top:4px;font:italic 900 15px "Arial Black",Impact,sans-serif;letter-spacing:1px;color:#fff36b;text-shadow:0 0 12px rgba(255,240,100,.7);animation:nb .6s ease-in-out infinite alternate}
.nb.show{display:block}
@keyframes nb{to{transform:scale(1.12)}}
.best,.ext{margin-top:6px;font-weight:800;font-size:13px;letter-spacing:2px;color:rgba(255,255,255,.75)}
.ext{color:var(--c);font-size:12px}
.row{display:flex;gap:12px;justify-content:center;margin-top:20px}
.btn{flex:1;min-height:54px;border-radius:16px;font:italic 900 20px "Arial Black",Impact,sans-serif;letter-spacing:.02em;cursor:pointer;touch-action:manipulation}
.btn.prim{background:var(--c);color:#0b0620;border:none;box-shadow:0 0 24px var(--g)}
.btn.ghost{background:rgba(255,255,255,.04);color:#fff;border:2px solid rgba(255,255,255,.4)}
.tip{margin-top:14px;font-weight:700;font-size:11px;letter-spacing:1.5px;color:rgba(255,255,255,.5)}
@media (max-width:520px){.pv{width:72px;height:72px}.pick b{font-size:21px}.keys{font-size:11px}}
@media (max-height:520px) and (min-width:600px){.title{font-size:60px}.btns{margin-top:8px}.keys{margin-top:8px}.pick{width:min(360px,46%)}.pv{width:64px;height:64px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu" class="ov show">
  <div class="title">CEO RUN</div>
  <div class="kick">Pick your CEO</div>
  <div class="btns">
    <button class="pick j" id="pJ" type="button"><canvas class="pv" id="cvJ"></canvas><span><b>PLAY AS JENSEN</b><i>Dodge the Chinese models</i><em id="bestJ">BEST 0 m</em></span></button>
    <button class="pick s" id="pS" type="button"><canvas class="pv" id="cvS"></canvas><span><b>PLAY AS SAM</b><i>Take their RAM</i><em id="bestS">BEST 0 GB</em></span></button>
  </div>
  <div class="keys" id="keys"></div>
  <button class="mini" id="snd" type="button">SOUND: ON</button>
</div>
<button class="mini" id="mbtn" type="button">MENU</button>
<div id="over" class="ov"><div class="ocard">
  <div class="gov">GAME OVER</div>
  <div class="why" id="why">CAUGHT BY THE MODELS</div>
  <div class="lbl" id="olbl">SCORE</div>
  <div class="big" id="osc">0 m</div>
  <div class="nb" id="onb">NEW BEST!</div>
  <div class="best" id="obest">BEST 0 m</div>
  <div class="ext" id="oext"></div>
  <div class="row"><button class="btn prim" id="retry" type="button">RETRY</button><button class="btn ghost" id="omenu" type="button">MENU</button></div>
  <div class="tip" id="otip">SPACE TO RETRY &middot; ESC FOR MENU</div>
</div></div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,S=1,VW=1600,PX=300;
const LH=450,TAU=Math.PI*2,PI=Math.PI,G=2700,JV=960,JV2=860,GY1=352,GY2=366,TU=JV/G;
/* game-mode state (menu / single-character stage) */
let MODE='menu',STAGE=null,PH='play',EY0=0,EY1=450,WR=4,OY=0,HU=1,deadT=0,overT=0,x0=0,hintT=0,tileSc=0,slideKey=false,slideT=0,strikes=0,strikeFlash=0,gest=null,bestNow=0;
const TOUCH=('ontouchstart' in window)||!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t;
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function RR(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function fs(g,f,s,lw){if(f){g.fillStyle=f;g.fill();}if(s){g.strokeStyle=s;g.lineWidth=lw||2;g.stroke();}}
function limb(g,x0,y0,x1,y1,x2,y2,w,col,ol,ow){g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=ol;g.lineWidth=w+(ow||3.5);g.stroke();g.strokeStyle=col;g.lineWidth=w;g.stroke();}
function legPts(hx,hy,A,B,l1,l2){const kx=hx+Math.sin(A)*l1,ky=hy+Math.cos(A)*l1,a2=A-B;return[kx,ky,kx+Math.sin(a2)*l2,ky+Math.cos(a2)*l2,a2];}
function star4(g,x,y,r,rot){g.beginPath();for(let i=0;i<8;i++){const a=rot+i*PI/4,rr=i%2?r*.26:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();}

/* ---------- glow sprites ---------- */
function mkGlow(rgb){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba('+rgb+',1)');gr.addColorStop(.35,'rgba('+rgb+',.38)');gr.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=gr;g.fillRect(0,0,128,128);return c;}
const GL={white:mkGlow('255,255,255'),green:mkGlow('130,255,70'),cyan:mkGlow('70,240,255'),warm:mkGlow('255,215,140'),red:mkGlow('255,60,90')};
function glow(g,spr,x,y,r,a){g.save();g.globalCompositeOperation='lighter';g.globalAlpha=a;g.drawImage(spr,x-r,y-r,r*2,r*2);g.restore();}

/* ---------- audio ---------- */
let AC=null,master=null,muted=false,nextNote=0,step=0,nbuf=null;
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume().catch(()=>{});return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);nextNote=AC.currentTime+.06;}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.5;const b=document.getElementById('snd');if(b)b.textContent='SOUND: '+(muted?'OFF':'ON');}
function tone(f,t,d,type,vol,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03);}
function noise(t,d,vol,hp){if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03);}
let silent=true;
function sfx(n,k){if(!AC||muted||silent)return;const t=AC.currentTime;
  if(n==='jump')tone(300,t,.13,'square',.07,640);
  else if(n==='jump2')tone(520,t,.15,'square',.07,1150);
  else if(n==='land')tone(130,t,.08,'triangle',.12,60);
  else if(n==='slide')noise(t,.25,.07,1800);
  else if(n==='near'){tone(1100,t,.32,'sawtooth',.06,180);noise(t,.3,.06,900);}
  else if(n==='ram'){const f=mf(76+Math.min(k||0,12));tone(f,t,.08,'square',.06);tone(f*1.5,t+.055,.1,'square',.05);}
  else if(n==='drain')tone(320,t,.35,'sawtooth',.05,70);
  else if(n==='hit'){tone(260,t,.5,'sawtooth',.09,45);noise(t,.4,.1,300);}}
const CH=[[45,0],[41,1],[48,1],[43,1]];
function music(){if(!AC||muted)return;if(nextNote<AC.currentTime-.3)nextNote=AC.currentTime+.05;
  while(nextNote<AC.currentTime+.14){const st=step%16,ch=CH[(step>>4)%4],root=ch[0],th=ch[1]?4:3,t=nextNote;
    if(st%4===0)tone(150,t,.13,'sine',.28,42);
    if(st%2===0)tone(mf(root+(st%4===2?12:0)),t,.11,'square',.05);
    const arp=[0,7,12,th+12,7,12,th+12,19][st%8];tone(mf(root+24+arp),t,.09,'square',.026);
    if(st%2===1)noise(t,.03,.03,7000);if(st%8===4)noise(t,.1,.06,2400);
    nextNote+=60/152/4;step++;}}

/* ---------- state ---------- */
function mkRunner(){return{x:0,alt:0,vy:0,on:true,jumps:0,slide:false,wasSlide:false,slideHeld:false,phase:0,sq:0,sqv:0,hair:0,hv:0,auto:true,idle:0,wantDbl:false,inv:0,happy:0,panic:0};}
function mkLane(gy,dc,ac){return{t:0,v:430,cam:-PX,camY:0,ts:1,slow:0,flash:0,shake:0,zoom:1,parts:[],pops:[],lines:[],r:mkRunner(),gy,dc,ac,nm:0};}
const T={},B={};
function fillLines(L){for(let i=0;i<16;i++)L.lines.push({x:Math.random(),y:Math.random(),l:rnd(60,200),s:rnd(1.4,2.6)});}
function resetTop(){for(const k in T)delete T[k];Object.assign(T,mkLane(GY1,'#9a90e8','#b4ff6e'),{en:[],bld:[{x0:-3000,x1:Infinity}],pend:null,lastEnd:STAGE?1.2:0,n:0,lastTy:'',over:true,dflash:0});fillLines(T);}
function resetBot(){for(const k in B)delete B[k];Object.assign(B,mkLane(GY2,'#f6e2bd','#8ff'),{laps:[],hz:[],nextX:STAGE?620:520,ram:0,show:0,count:0,stage:0,mflash:0,punch:0,combo:0,ln:0,groundT:0,lastKind:'',dflash:0});fillLines(B);}
resetTop();resetBot();
const stars=[];for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random(),s:rnd(.8,2.2),f:rnd(.6,2.4),p:rnd(0,6)});
const motes=[];for(let i=0;i<34;i++)motes.push({x:Math.random(),y:Math.random(),s:rnd(.3,1),p:rnd(0,6),r:rnd(1,2.6)});
const STG=['8GB','4GB','2GB','1GB','512MB','256MB','128MB','64MB','32MB','16MB','8MB','4MB','2MB','1MB','640KB'];

/* ---------- particles ---------- */
function part(L,x,y,vx,vy,life,size,col,kind,grav,add){if(L.parts.length>420)return;L.parts.push({x,y,vx,vy,life,max:life,size,col,kind,grav:grav||0,add:!!add,rot:Math.random()*TAU});}
function burst(L,x,y,n,col,spd,kind,life,size,grav,add){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=spd*(.3+Math.random()*.7);part(L,x,y,Math.cos(a)*s,Math.sin(a)*s,life*(.5+Math.random()*.5),size*(.6+Math.random()*.6),col,kind,grav,add);}}
function dust(L,x,y,n){for(let i=0;i<n;i++)part(L,x+rnd(-12,12),y-rnd(0,4),rnd(-110,70),rnd(-55,-5),rnd(.3,.6),rnd(5,10),L.dc,4);}
function pop(L,x,y,txt,col,size){L.pops.push({x,y,txt,col,size,life:.85,max:.85});}
function updFx(L,dt,real){
  for(let i=L.parts.length-1;i>=0;i--){const p=L.parts[i];p.life-=dt;if(p.life<=0){L.parts.splice(i,1);continue;}p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  for(let i=L.pops.length-1;i>=0;i--){const p=L.pops[i];p.life-=real;if(p.life<=0){L.pops.splice(i,1);continue;}p.y-=real*60*(p.life/p.max);}
  for(const l of L.lines){l.x-=L.v*l.s*dt/1600;if(l.x<-.2){l.x=1.1;l.y=Math.random();}}
  L.flash=Math.max(0,L.flash-real*3.2);L.shake*=Math.exp(-real*9);L.zoom+=(1-L.zoom)*Math.min(1,real*5);L.nm-=real;
}
function drawParts(g,L){
  for(const p of L.parts){const a=p.life/p.max,sx=p.x-L.cam;if(sx<-80||sx>VW+80)continue;
    g.globalCompositeOperation=p.add?'lighter':'source-over';g.globalAlpha=a;
    if(p.kind===0){g.fillStyle=p.col;g.beginPath();g.arc(sx,p.y,p.size*(.4+.6*a),0,TAU);g.fill();}
    else if(p.kind===1){g.strokeStyle=p.col;g.lineWidth=p.size;g.lineCap='round';g.beginPath();g.moveTo(sx,p.y);g.lineTo(sx-p.vx*.045,p.y-p.vy*.045);g.stroke();}
    else if(p.kind===2){g.fillStyle=p.col;star4(g,sx,p.y,p.size*(.4+a*.8),p.rot+(1-a)*2);g.fill();}
    else if(p.kind===3){g.globalAlpha=a*.85;g.strokeStyle=p.col;g.lineWidth=3*a+.6;g.beginPath();g.arc(sx,p.y,p.size*(1-a)+5,0,TAU);g.stroke();}
    else if(p.kind===4){g.globalAlpha=a*.5;g.fillStyle=p.col;g.beginPath();g.arc(sx,p.y,p.size*(1.7-a*.8),0,TAU);g.fill();}
    else{g.globalAlpha=1;glow(g,GL.white,sx,p.y,p.size*2.6,a);g.globalCompositeOperation='lighter';g.globalAlpha=a;g.fillStyle='#fff';star4(g,sx,p.y,p.size*(1.3-a*.3),PI/8);g.fill();}
  }
  g.globalAlpha=1;g.globalCompositeOperation='source-over';
}
function drawPops(g,L){g.textAlign='center';
  for(const p of L.pops){const a=p.life/p.max,age=p.max-p.life,sc=1+Math.max(0,1-age*9)*.9;g.save();g.translate(p.x-L.cam,p.y);g.scale(sc,sc);g.rotate(-.08);g.globalAlpha=Math.min(1,a*2.6);
    g.font='900 italic '+p.size+'px "Arial Black",Impact,"Helvetica Neue",sans-serif';g.lineJoin='round';g.lineWidth=p.size*.24;g.strokeStyle='rgba(12,8,34,.92)';g.strokeText(p.txt,0,0);
    g.shadowColor=p.col;g.shadowBlur=16;g.fillStyle=p.col;g.fillText(p.txt,0,0);g.restore();}
  g.textAlign='left';}

/* ---------- runner physics ---------- */
function jump(r,L){if(!(r.on||r.jumps<2))return;const first=r.jumps===0;r.vy=first?JV:JV2;r.jumps++;const y=L.gy-r.alt;
  if(first){if(r.on)dust(L,r.x,L.gy,5);sfx('jump');}
  else{part(L,r.x,y-30,0,0,.35,46,L.ac,3,0,true);burst(L,r.x,y-20,10,L.ac,260,1,.35,2.4,300,true);burst(L,r.x,y-20,5,'#fff',160,2,.4,7,0,true);sfx('jump2');}
  r.on=false;r.slide=false;r.sqv=6.2;}
function stepRunner(r,dt,v,over,L){const gy=L.gy;
  r.x+=v*dt;
  if(r.on&&!over){r.on=false;r.vy=0;}
  if(r.on){r.phase+=dt*v*.043;r.slide=r.slideHeld;
    if(r.slide){if(!r.wasSlide){sfx('slide');r.sqv=-3;}
      if(Math.random()<dt*45)part(L,r.x-14,gy-2,rnd(-150,-40),rnd(-60,-10),rnd(.25,.45),rnd(4,8),L.dc,4);
      if(Math.random()<dt*34)part(L,r.x+22,gy-3,rnd(-280,-120),rnd(-150,-30),.25,2.2,L.ac,1,500,true);}
    else if(Math.random()<dt*10)part(L,r.x-12,gy-2,rnd(-70,-20),rnd(-34,-8),.3,rnd(3,5.5),L.dc,4);
  }else{r.slide=false;
    r.vy-=G*dt*((r.slideHeld&&r.vy<250)?2.4:1);r.alt+=r.vy*dt;
    if(Math.random()<dt*26)part(L,r.x-10,gy-r.alt-rnd(20,70),rnd(-90,-20),rnd(-20,20),.3,rnd(1.6,3.4),L.ac,0,0,true);
    if(over&&r.vy<=0&&r.alt<=0&&r.alt>-28){r.alt=0;r.vy=0;r.on=true;r.jumps=0;r.sqv=-7.5;dust(L,r.x,gy,8);sfx('land');}
    else if(r.alt<-80){const fh=r.lock&&r.inv<=0;r.vy=1180;r.jumps=1;burst(L,r.x,gy+40,10,L.ac,240,1,.4,2.5,200,true);if(!r.auto&&!r.lock)r.inv=1;if(fh)r.fellHit=true;}
  }
  r.wasSlide=r.slide;
  r.sqv+=(-r.sq*260-r.sqv*17)*dt;r.sq+=r.sqv*dt;
  const ht=r.on?Math.sin(r.phase*2)*1.3:clamp(-r.vy*.006,-4,5);

/* ---------- Jensen stage: what comes next ---------- */

  else if(t<26)ty=q<.24?'strut':q<.4?'gap':q<.56?'slide':q<.72?'heli':q<.86?'crate':'stamp';
  else ty=q<.18?'strut':q<.32?'slide':q<.48?'heli':q<.64?'trio':q<.76?'gap':q<.88?'stamp':'crate';
  if(ty===L.lastTy&&(ty==='gap'||ty==='trio'||ty==='stamp'))ty='strut';
  const d=clamp((t-5)/70,0,1);

    if(e.sy===0){e.landed=true;L.shake=Math.max(L.shake,9);for(let i=0;i<10;i++)part(L,e.x+rnd(-40,40),GY1-2,rnd(-120,120),rnd(-90,-20),rnd(.3,.6),rnd(5,10),L.dc,4);sfx('land');}}}

function maybeHazard(end,v){const L=B,t=L.t;if(L.ln<3||t<2.5)return;const d=clamp((t-5)/60,0,1);if(Math.random()>lerp(.6,.9,d))return;

    g.save();g.textAlign='center';g.shadowColor='#ffe066';g.shadowBlur=10;g.fillStyle='#fff36b';g.font='900 20px "Arial Black",Impact,sans-serif';g.fillText('AGI',x,by-53);
    g.shadowBlur=6;g.fillStyle='#ffffff';g.font='900 8.5px "Arial Black",Impact,sans-serif';g.fillText('ACHIEVED',x,by-42);g.fillText('INTERNALLY',x,by-33);g.restore();}
  else if(h.ty==='suit'){const py=y-h.alt-24;dropShadow(g,x,y,30,h.alt,'rgba(90,40,20,.25)');
    g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;g.lineCap='round';for(let i=0;i<3;i++){const ly=py-14+i*14+Math.sin(now*8+i)*2;g.beginPath();g.moveTo(x+58,ly);g.lineTo(x+88+i*8,ly);g.stroke();}
    g.save();g.translate(x,py);g.rotate(Math.sin(h.ph*1.6)*.07-.05);
    RR(g,-50,-20,104,48,2);fs(g,'#e6e2d8','#8a7f70',1.4);RR(g,-54,-24,104,48,2);fs(g,'#fffdf6','#8a7f70',1.6);
    g.fillStyle='#b3122e';g.fillRect(-54,-24,104,12);g.fillStyle='#fff';g.font='900 8px "Arial Black",Impact,sans-serif';g.textAlign='center';g.fillText('LAWSUIT',-2,-15);
    g.fillStyle='#22263a';g.font='900 10.5px "Arial Black",Impact,sans-serif';g.fillText('MUSK v. ALTMAN',-2,2);
    g.strokeStyle='rgba(60,60,80,.35)';g.lineWidth=1.2;for(let i=0;i<3;i++){g.beginPath();g.moveTo(-46,9+i*5);g.lineTo(42,9+i*5);g.stroke();}
    g.strokeStyle='#9aa0aa';g.lineWidth=2;g.beginPath();g.moveTo(-50,-20);g.lineTo(-44,-20);g.stroke();
    g.restore();g.textAlign='left';}
  else if(h.ty==='slip'){const py=y-h.alt-22;dropShadow(g,x,y,26,h.alt,'rgba(90,40,20,.25)');
    g.save();g.translate(x,py);g.rotate(Math.sin(h.ph*2.4)*.16);
    RR(g,-40,-22,80,46,3);fs(g,'#ffb3c9','#a83a5c',1.8);
    g.beginPath();g.moveTo(-40,-22);g.lineTo(0,-2);g.lineTo(40,-22);g.strokeStyle='rgba(168,58,92,.6)';g.lineWidth=1.4;g.stroke();
    RR(g,-34,-6,68,26,2);fs(g,'#fff4f7','#a83a5c',1);
    g.fillStyle='#7a1030';g.textAlign='center';g.font='900 8.5px "Arial Black",Impact,sans-serif';g.fillText('THE BOARD',0,5);g.fillText('HAS DECIDED',0,15);
    g.fillStyle='#d3122e';g.beginPath();g.arc(0,-6,4.5,0,TAU);g.fill();
    g.restore();g.textAlign='left';}
}

/* ---------- stage rendering + HUD ---------- */
function heart(g,x,y,s){g.beginPath();g.moveTo(x,y+s*.3);g.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);g.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.78,x,y+s);
  g.bezierCurveTo(x,y+s*.78,x+s*.5,y+s*.6,x+s*.5,y+s*.3);g.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);g.closePath();}
function capCounter(g,X,now){
  RR(g,X-262,12,268,104,14);fs(g,'rgba(8,6,22,.82)');
  g.textAlign='right';g.font='800 11.5px "Avenir Next","Helvetica Neue",Arial,sans-serif';g.letterSpacing='2.5px';g.fillStyle='#b4ff6e';g.fillText('MARKET CAP',X-9,33);g.letterSpacing='0px';
  g.save();g.translate(X-12,68);g.scale(1+mcPunch*.12,1+mcPunch*.12);g.font='900 34px "Arial Black",Impact,"Helvetica Neue",sans-serif';g.lineJoin='round';g.lineWidth=5;g.strokeStyle='rgba(8,20,8,.85)';
  const txt=fmtMc(mcap);g.strokeText(txt,0,0);g.shadowColor=mcPunch>0?'#ff3355':'#7dff3a';g.shadowBlur=16;g.fillStyle=mcPunch>.3?'#ffd0d6':'#f2ffe8';g.fillText(txt,0,0);g.restore();
  g.font='800 12.5px "Avenir Next","Helvetica Neue",Arial,sans-serif';g.fillStyle='rgba(255,255,255,.72)';g.fillText('DISTANCE '+curScore().toLocaleString('en-US')+' m',X-12,90);
  // stock chart
  const x0c=X-238,wc=226,y0c=97,hc=12;RR(g,x0c,y0c,wc,hc,3);fs(g,'rgba(255,255,255,.1)');
  if(mcHist.length>1){let lo=Infinity,hi=-Infinity;for(const v of mcHist){lo=Math.min(lo,v);hi=Math.max(hi,v);}if(hi-lo<.05)hi=lo+.05;
    g.lineWidth=1.8;g.lineJoin='round';const n=mcHist.length;
    for(let i=1;i<n;i++){const a=mcHist[i-1],b=mcHist[i];g.strokeStyle=b<a?'#ff5a4a':'#7dff9a';g.beginPath();
      g.moveTo(x0c+3+(i-1)/(n-1)*(wc-6),y0c+hc-2-(a-lo)/(hi-lo)*(hc-4));g.lineTo(x0c+3+i/(n-1)*(wc-6),y0c+hc-2-(b-lo)/(hi-lo)*(hc-4));g.stroke();}}
  g.textAlign='left';}
function livesRow(g,X,unit){const y=124,best=Math.max(curScore(),bestNow),nb=bestNow>0&&curScore()>bestNow;
  RR(g,X-262,y,268,34,12);fs(g,STAGE==='J'?'rgba(8,6,22,.82)':'rgba(34,12,22,.5)');
  g.font='800 11.5px "Avenir Next","Helvetica Neue",Arial,sans-serif';g.letterSpacing='2px';g.textAlign='left';g.fillStyle=nb?'#fff36b':'rgba(255,255,255,.75)';
  g.fillText((nb?'NEW BEST ':'BEST ')+best.toLocaleString('en-US')+unit,X-250,y+22);g.letterSpacing='0px';
  const r=lane().r;
  for(let i=0;i<3;i++){const cx=X-60+i*24,on=i<lives,lost=i===lives&&r.inv>0;heart(g,cx,y+8,17);
    if(on){g.save();g.shadowColor='#ff3a6a';g.shadowBlur=10;fs(g,'#ff4d6d','#7a1030',1.5);g.restore();}
    else{fs(g,lost&&Math.floor(r.inv*10)%2?'rgba(255,90,120,.6)':'rgba(255,255,255,.12)','rgba(255,255,255,.4)',1.3);}}}
function hud(now){const g=ctx,u=HU,J=STAGE==='J',L=lane();g.setTransform(DPR*u,0,0,DPR*u,0,0);const hw=W/u,hh=H/u,port=hw<640,X=hw-20;
  if(J)capCounter(g,X,now);else ramCounter(g,X,0,L,now);
  livesRow(g,X,J?' m':' GB');
  const lbl=J?'DODGE THE CHINESE MODELS':'TAKE THEIR RAM',lc=J?'#8dff4a':'#5ff';
  g.font='800 12.5px "Avenir Next","Helvetica Neue",Arial,sans-serif';g.letterSpacing='2.5px';const lw=g.measureText(lbl).width+36;g.letterSpacing='0px';
  if(port)label(g,lbl,lc,(hw-lw)/2,170);else label(g,lbl,lc,110,16);
  if(PH==='play'&&hintT<6.5){const a=Math.min(1,6.5-hintT)*Math.min(1,hintT*3);
    const lines=J?(TOUCH?['TAP TO JUMP, TAP AGAIN IN THE AIR TO DOUBLE JUMP','SWIPE DOWN TO SLIDE UNDER HELI SPIES','3 LIVES. DO NOT FALL OFF THE ROOF']
                         :['SPACE / W / ↑ TO JUMP, AGAIN IN THE AIR TO DOUBLE JUMP','S / ↓ TO SLIDE UNDER HELI SPIES','3 LIVES. DO NOT FALL OFF THE ROOF'])
                    :(TOUCH?['TAP TO JUMP AND GRAB THE RAM','JUMP OVER ORBS, INVOICES AND SIGNS','SWIPE DOWN UNDER FLYING PAPERWORK']
                         :['SPACE / W / ↑ TO JUMP AND GRAB THE RAM','JUMP OVER ORBS, INVOICES AND SIGNS','S / ↓ TO SLIDE UNDER FLYING PAPERWORK']);
    g.font='800 13px "Avenir Next","Helvetica Neue",Arial,sans-serif';g.letterSpacing='1.5px';let mw=0;for(const l of lines)mw=Math.max(mw,g.measureText(l).width);
    const k=Math.min(1,(hw-48)/mw),cy=port?212:hh*.3,bh=(lines.length*20+16)*k;
    g.save();g.globalAlpha=a;g.translate(hw/2,cy);g.scale(k,k);RR(g,-mw/2-16,-6,mw+32,lines.length*20+16,14);fs(g,'rgba(8,6,22,.72)',J?'rgba(141,255,74,.5)':'rgba(85,255,255,.5)',1.5);
    g.textAlign='center';lines.forEach((l,i)=>{g.fillStyle=i===0?'#fff':'rgba(255,255,255,.8)';g.fillText(l,0,14+i*20);});g.restore();g.letterSpacing='0px';g.textAlign='left';}
}
function renderStage(now){const L=lane(),J=STAGE==='J';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(OY>0){const gr=ctx.createLinearGradient(0,0,0,OY);if(J){gr.addColorStop(0,'#020109');gr.addColorStop(1,'#060316');}else{gr.addColorStop(0,'#fff1d9');gr.addColorStop(1,'#ffdca8');}ctx.fillStyle=gr;ctx.fillRect(0,0,W,OY+2);}
  const yb=OY+LH*S;if(yb<H){ctx.fillStyle=J?'#0a0522':'#5a2d16';ctx.fillRect(0,yb-2,W,H-yb+2);}
  ctx.save();ctx.setTransform(DPR*S,0,0,DPR*S,0,DPR*OY);if(J)drawTop(ctx,now);else drawBottom(ctx,now);ctx.restore();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const vg=ctx.createRadialGradient(W/2,H*.55,Math.min(W,H)*.42,W/2,H*.55,Math.hypot(W,H)*.6);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+(J?.5:.32)+')');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  if(L.dflash>0){ctx.globalAlpha=L.dflash*.38;ctx.fillStyle='#ff2a55';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  hud(now);}

/* ---------- menu portraits (the real character art, running) ---------- */
const PR=[mkRunner(),mkRunner()];
function portraits(dt,now){for(let i=0;i<2;i++){const r=PR[i],c=$(i?'cvS':'cvJ'),g=c.getContext('2d'),w=c.width,k=w/84;r.phase+=dt*430*.043;
  g.setTransform(1,0,0,1,0,0);const gr=g.createLinearGradient(0,0,0,w);
  if(i){gr.addColorStop(0,'#ffdca8');gr.addColorStop(.6,'#f8a970');gr.addColorStop(1,'#d86f5c');}else{gr.addColorStop(0,'#060316');gr.addColorStop(.5,'#170b45');gr.addColorStop(1,'#8a2480');}
  g.fillStyle=gr;g.fillRect(0,0,w,w);g.setTransform(k,0,0,k,0,0);
  if(i){g.fillStyle='#f3bd7c';g.fillRect(0,70,84,14);g.fillStyle='#ffe6b8';g.fillRect(0,70,84,1.5);}
  else{g.fillStyle='#fff8dc';g.beginPath();g.arc(68,15,7,0,TAU);g.fill();g.fillStyle='#3d3190';g.fillRect(0,70,84,14);g.fillStyle='#b4ff6e';g.fillRect(0,72.5,84,1.6);}
  g.setTransform(k*.62,0,0,k*.62,k*38,k*70);drawRunner(g,r,i,0,0,now);}}

/* ---------- input ---------- */
const JK=['Space','ArrowUp','KeyW'],SK=['ArrowDown','KeyS'];
addEventListener('keydown',e=>{initAudio();const c=e.code;
  if(c==='KeyM'){toggleMute();return;}
  if(MODE==='menu'){if(c==='Digit1'||c==='KeyJ')startStage('J');else if(c==='Digit2'||c==='KeyK')startStage('S');return;}
  if(c==='Escape'){e.preventDefault();toMenu();return;}
  if(PH==='play'){const L=lane();if(JK.includes(c)){e.preventDefault();if(!e.repeat)jump(L.r,L);}else if(SK.includes(c)){e.preventDefault();slideKey=true;}}
  else if(PH==='over'&&overT>.35&&(c==='Space'||c==='Enter')){e.preventDefault();retry();}
  else if(JK.includes(c)||SK.includes(c))e.preventDefault();});
addEventListener('keyup',e=>{if(SK.includes(e.code))slideKey=false;});
addEventListener('pointerdown',initAudio);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointerdown',e=>{if(MODE!=='stage'||PH!=='play')return;e.preventDefault();const L=lane(),r=L.r,j0=r.jumps;jump(r,L);
  gest={id:e.pointerId,x:e.clientX,y:e.clientY,t:performance.now(),jumped:r.jumps!==j0,swiped:false};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!gest||e.pointerId!==gest.id||gest.swiped||PH!=='play')return;const dy=e.clientY-gest.y,dx=e.clientX-gest.x;
  if(dy>26&&dy>Math.abs(dx)*1.1){gest.swiped=true;const r=lane().r;if(gest.jumped&&performance.now()-gest.t<400)r.vy=Math.min(r.vy,-300);slideT=.6;}});
const endG=e=>{if(gest&&e.pointerId===gest.id)gest=null;};
cv.addEventListener('pointerup',endG);cv.addEventListener('pointercancel',endG);
$('pJ').addEventListener('click',()=>startStage('J'));
$('pS').addEventListener('click',()=>startStage('S'));
$('retry').addEventListener('click',retry);
$('omenu').addEventListener('click',toMenu);
$('mbtn').addEventListener('click',toMenu);
$('snd').addEventListener('click',()=>{initAudio();toggleMute();});
$('keys').innerHTML=TOUCH?'TAP = JUMP &middot; TAP AGAIN IN THE AIR = DOUBLE JUMP<br>SWIPE DOWN = SLIDE &middot; 3 LIVES'
  :'<kbd>SPACE</kbd> <kbd>W</kbd> <kbd>↑</kbd> or click = jump, again in the air = double jump<br><kbd>S</kbd> <kbd>↓</kbd> = slide &middot; <kbd>ESC</kbd> = menu &middot; <kbd>M</kbd> = sound &middot; <kbd>1</kbd> <kbd>2</kbd> = pick';
if(TOUCH)$('otip').textContent='TAP RETRY OR MENU';

/* ---------- boot ---------- */
let rsT=0;
addEventListener('resize',()=>{layout(false);clearTimeout(rsT);rsT=setTimeout(()=>layout(true),160);});
layout(true);resetTop();resetBot();warm();refreshBest();ui();
let last=performance.now();
function tick(ms){const real=Math.min(Math.max(0,(ms-last)/1000),.034);last=ms;const now=ms/1000;
  if(MODE==='menu'){
    for(const L of [T,B]){L.slow-=real;const tg=L.slow>0?.22:1;L.ts+=(tg-L.ts)*Math.min(1,real*22);}
    updTop(real*T.ts,real);updBot(real*B.ts,real,now);render(now);portraits(real,now);}
  else{const L=lane(),r=L.r;
    if(PH==='play'){L.slow-=real;const tg=L.slow>0?.3:1;L.ts+=(tg-L.ts)*Math.min(1,real*22);
      if(gest&&gest.swiped)slideT=Math.max(slideT,.12);slideT=Math.max(0,slideT-real);r.slideHeld=slideKey||slideT>0;hintT+=real;
      if(STAGE==='J'){updTop(real*L.ts,real);if(PH==='play'){mcap+=real*L.ts*L.v/40*.004;mcT+=real;if(mcT>.25){mcT=0;mcHist.push(mcap);if(mcHist.length>90)mcHist.shift();}}}
      else updBot(real*L.ts,real,now);}
    else{deadT+=real;if(PH==='over')overT+=real;updFx(L,real*.5,real);
      if(PH==='dead'&&deadT>.9){PH='over';overT=0;showOver();}}
    L.dflash=Math.max(0,(L.dflash||0)-real*1.8);mcPunch=Math.max(0,mcPunch-real*2);
    renderStage(now);}
  music();requestAnimationFrame(tick);}
requestAnimationFrame(tick);

</script>
